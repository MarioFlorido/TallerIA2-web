<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taller IA</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800&display=swap" rel="stylesheet">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo=' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<script>document.documentElement.classList.add('js')</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>

<style>
:root{
  --bg:#ffffff;              /* fondo general */
  --panel:#ffffff;           /* panel lateral */
  --text:#0f172a;            /* texto principal */
  --muted:#64748b;           /* texto secundario */
  --accent:#C2410C;          /* acento principal (naranja quemado, contraste 5.2:1 con blanco) */
  --accent-rgb:194,65,12;    /* mismo color en RGB, para derivados con transparencia */
  --accent-soft:#FDBA8C;     /* versión clara: ilustración sobre fondo de acento */
  --border:rgba(0,0,0,0.08); /* bordes suaves */
}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* === ARQUITECTURA: secciones a 100% ancho con inner centrado === */

#content{
  width:100%;
}

/* Cada fase ocupa el 100% del viewport y su padding controla el aire lateral */
.phase-block{
  padding:60px 40px;
}

/* reveal progresivo (solo si hay JS) */
.js .phase-block{
  opacity:0;
  transform:translateY(50px);
  transition:opacity .8s ease, transform .8s ease;
}

.js .phase-block.visible{
  opacity:1;
  transform:translateY(0);
}

@media(prefers-reduced-motion:reduce){
  .js .phase-block{opacity:1;transform:none;transition:none}
}

.load-error{
  color:var(--muted);
  line-height:1.6;
}

:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
}

/* Wrapper interno que centra el contenido a max-width */
.phase-inner{
  max-width:1100px;
  margin:0 auto;
}

/* --- FASE 2: fondo gris claro a sangre completa --- */
.phase-block.phase-bg-grey{
  background:#e9e9e9;
}

/* --- FASE 3: imagen de nodos como fondo sobre blanco --- */
.phase-block.phase-bg-nodes{
  background-color:#ffffff;
  position:relative;
}

/* La red es una silueta: se tiñe con el acento mediante máscara */
.phase-block.phase-bg-nodes::before{
  content:'';
  position:absolute;
  inset:0;
  background-color:var(--accent);
  opacity:.45;
  -webkit-mask:url('img/red.png') center/cover no-repeat;
  mask:url('img/red.png') center/cover no-repeat;
  pointer-events:none;
}

.phase-block.phase-bg-nodes .phase-inner{
  position:relative;
}

/* --- FASE 4: fondo tenue del acento --- */
.phase-block.phase-bg-tint{
  background:rgba(var(--accent-rgb),0.12);
}

/* --- Sección inferior (guía ética + footer) --- */
.bottom-area{
  box-sizing:border-box;
  width:100%;
  padding:60px 40px 0;
}

.bottom-inner{
  max-width:1100px;
  margin:0 auto;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* --- HERO: ancho completo con bloque púrpura --- */
.hero{
  width:100%;
  background:var(--accent);
  color:white;
  padding:90px 40px;
  animation:fadeUp .6s ease;
  box-sizing:border-box;
}

.hero-inner{
  max-width:1100px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1.6fr 1fr;
  gap:40px;
  align-items:center;
}

.hero-content h1{
  font-family:'Playfair Display', serif;
  font-size:clamp(4rem,9vw,7.5rem);
  font-weight:900;
  letter-spacing:-2.5px;
  line-height:0.95;
  color:white;
  margin:22px 0 0;
}

.hero-content p{
  margin-top:22px;
  font-size:1.2rem;
  color:rgba(255,255,255,0.88);
  max-width:none;
  line-height:1.5;
  font-family:'Inter',sans-serif;
}

.hero-content p strong{
  color:white;
  font-weight:700;
}

.hero-badge{
  display:inline-block;
  font-size:.72rem;
  font-weight:700;
  letter-spacing:2.5px;
  text-transform:uppercase;
  color:white;
  background:rgba(255,255,255,0.18);
  padding:8px 16px;
  border-radius:999px;
}

.hero-meta{
  display:flex;
  gap:14px;
  margin-top:32px;
  font-size:.9rem;
  color:rgba(255,255,255,0.8);
  flex-wrap:wrap;
  letter-spacing:.5px;
}

.hero-illustration{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.hero-illustration .brain{
  width:100%;
  max-width:380px;
  aspect-ratio:707/590;
  background-color:var(--accent-soft);
  -webkit-mask:url('img/cerebro.png') center/contain no-repeat;
  mask:url('img/cerebro.png') center/contain no-repeat;
}

@media(max-width:768px){
  .hero{
    padding:60px 28px;
  }
  .hero-inner{
    grid-template-columns:1fr;
    gap:10px;
  }
  .hero-illustration{
    max-height:200px;
  }
  .phase-block{
    padding:48px 28px;
  }
  .bottom-area{
    padding:48px 28px 0;
  }
}

.phase-title{
  font-family:'Playfair Display', serif;
  font-size:clamp(2.6rem,4.8vw,3.6rem);
  margin-top:20px;
  margin-bottom:8px;
  font-weight:800;
  letter-spacing:-1px;
  line-height:1.05;
}

.phase-title span{
  color:var(--accent);
  font-style:italic;
  font-weight:400;
}

.phase-subtitle{
  color:var(--muted);
  margin-bottom:48px;
  font-size:1.05rem;
  max-width:640px;
  line-height:1.5;
}

/* --- GRID NORMAL (fases 1,2 y 4) --- */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));
  gap:60px 44px;
  width:100%;
}

.grid .card{
  width:100%;
  min-width:0;
}

/* --- FASE 3: composición editorial asimétrica --- */
.phase-3-grid{
  display:grid;
  grid-template-columns:repeat(12,minmax(0,1fr));
  gap:50px 40px;
  width:100%;
}

.phase-3-grid .card{
  width:100%;
  min-width:0;
  grid-column:span 6;
}

/* cada tercer elemento ocupa todo el ancho */
.phase-3-grid .card:nth-child(3n){
  grid-column:1 / -1;
}

/* responsive */
@media(max-width:900px){
  .phase-3-grid{
    grid-template-columns:1fr;
  }

  .phase-3-grid .card,
  .phase-3-grid .card:nth-child(3n){
    grid-column:auto;
  }
}

/* --- TARJETA (estilo editorial) --- */
.card{
  color:var(--text);
  background:#ffffff;
  box-sizing:border-box;
  padding:0 28px 28px;
  border:none;
  border-radius:6px;
  box-shadow:none;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
  cursor:default;
  transition:opacity .35s ease;
}

.card img{
  /* Ocupa todo el ancho de la tarjeta sobresaliendo del padding lateral */
  width:calc(100% + 56px);
  margin:0 -28px 24px;
  height:220px;
  object-fit:cover;
  transition:filter .4s ease;
}

.tag{
  display:inline-block;
  font-size:.72rem;
  font-weight:700;
  padding:0;
  background:none;
  color:var(--accent);
  letter-spacing:2.5px;
  text-transform:uppercase;
  margin:0 0 12px;
  border-radius:0;
}

/* Si la tarjeta empieza directamente con .tag (sin imagen), añadir aire arriba */
.card > .tag:first-child{
  margin-top:28px;
}

.card h3{
  font-family:'Playfair Display', serif;
  font-size:1.85rem;
  font-weight:700;
  line-height:1.1;
  margin:0 0 14px;
  letter-spacing:-0.5px;
}

.card p{
  margin:0 0 15px;
  color:var(--muted);
  font-size:.98rem;
  line-height:1.45;
}

/* --- Pie de la tarjeta: Explorar (izq) + Completar (der) --- */
.card-footer{
  margin-top:auto;
  padding-top:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
}

/* --- Botón CTA --- */
.activity-cta{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:0 5px 0 4px;
  font-family:'Inter',sans-serif;
  font-size:.88rem;
  font-weight:700;
  color:var(--bg);
  cursor:pointer;
  letter-spacing:.5px;
  text-transform:uppercase;
  border:1.5px solid var(--accent);
  transition:.25s;
  border-radius:5px;
  background-color:var(--accent);
}

/* --- Botón "Marcar completada" / "Actividad completada" --- */
.complete-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:none;
  border:none;
  padding:4px 0;
  font-family:'Inter',sans-serif;
  font-size:.78rem;
  font-weight:700;
  color:var(--muted);
  cursor:pointer;
  letter-spacing:1.5px;
  text-transform:uppercase;
  transition:color .25s;
}

.complete-btn:hover{
  color:var(--text);
}

.complete-btn svg{
  width:15px;
  height:15px;
  flex-shrink:0;
  transition:transform .3s ease;
}

.complete-btn:hover svg{
  transform:scale(1.1);
}

.complete-btn .state-default,
.complete-btn .state-done{
  display:inline-flex;
  align-items:center;
  gap:8px;
}

.complete-btn .state-done{
  display:none;
  color:#22c55e;
}

.card.done .complete-btn .state-default{display:none}
.card.done .complete-btn .state-done{display:inline-flex}

.card.done .complete-btn:hover .state-done{
  color:#15803d;
}

.activity-cta .arrow{
  transition:transform .3s ease;
  display:inline-block;
  font-size:1.1rem;
}

.activity-cta:hover{
  gap:14px;
}

.activity-cta:hover .arrow{
  transform:translateX(4px);
}

/* --- Estado completado --- */
.card.done{
  opacity:.5;
}

.card.done img{
  filter:grayscale(50%);
}

/* --- Panel lateral --- */
.overlay{
  position:fixed;
  inset:0;
  backdrop-filter:blur(10px);
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:100;
}

.overlay.open{display:block}

.panel{
  position:fixed;
  right:0;
  top:0;
  width:50%;
  height:100vh;
  background:var(--panel);
  color:#111;
  transform:translateX(100%);
  transition:.35s;
  padding:50px;
  padding-bottom:120px;
  overflow-y:auto;
  box-sizing:border-box;
  z-index:101;
}

.panel.open{transform:translateX(0)}

.panel h2{
  font-family:'Playfair Display', serif;
  font-size:2.8rem;
  font-weight:800;
  letter-spacing:-1px;
  line-height:1.1;
  margin:0 0 8px;
}

.panel-section{
  margin-top:32px;
}

.panel-section h4{
  font-size:1.05rem;
  font-weight:700;
  color:var(--accent);
  margin-bottom:10px;
}

.panel-section p{
  line-height:1.7;
  color:#333;
}

.panel-section pre{
  background:#020617;
  color:#f9fafb;
  padding:18px;
  border-radius:10px;
  font-family:'JetBrains Mono', monospace;
  font-size:.85rem;
  line-height:1.6;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
  overflow-x:hidden;
}

/* --- PROMPT COLAPSABLE --- */
.prompt-toggle-btn{
  width:100%;
  background:var(--muted);
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
  font-size:.95rem;
  display:flex;
  align-items:center;
  gap:10px;
  transition:.2s;
  font-family:'Inter',sans-serif;
}

.prompt-toggle-btn:hover{
  opacity:.9;
}

.prompt-toggle-btn .arrow{
  transition:transform .3s;
  font-size:1.1rem;
}

.prompt-toggle-btn.open .arrow{
  transform:rotate(90deg);
}

.prompt-code{
  max-height:0;
  overflow:hidden;
  transition:max-height .4s ease;
}

.prompt-code.open{
  max-height:3000px;
}

.prompt-code pre{
  margin-top:12px;
}

.close{
  position:absolute;
  top:20px;
  right:20px;
  cursor:pointer;
  border:none;
  color:inherit;
  font-size:1.5rem;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(0,0,0,.05);
  transition:.2s;
}

.close:hover{
  background:rgba(0,0,0,.1);
}

/* --- SECCIÓN ESPECIAL (ÉTICA) DESTACADA --- */
.special-section{
  margin-top:80px;
  border-radius:16px;
  border:1px solid var(--border);
  max-width:100%;
  overflow:hidden;
  background:rgba(100,100,100,0.05);
}

.special-toggle{
  width:100%;
  text-align:left;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:24px 28px;
  background:rgba(100,100,100,0.08);
  border:none;
  color:var(--muted);
  font-family:'Playfair Display', serif;
  font-size:1.7rem;
  font-weight:700;
  letter-spacing:-.3px;
  cursor:pointer;
  transition:.2s;
}

.special-toggle:hover{
  background:rgba(100,100,100,0.15);
}

.special-toggle .chevron{
  transition:transform .3s;
  font-size:1.4rem;
  color:var(--accent);
}

.special-section.open .chevron{
  transform:rotate(180deg);
}

.special-body{
  max-height:0;
  overflow:hidden;
  transition:max-height .4s ease;
  padding:0 28px;
}

.special-section.open .special-body{
  max-height:2000px;
  padding:0 28px 28px;
}

.special-body h2{
  color:var(--accent);
  font-size:1.4rem;
  margin-top:24px;
}

.special-body h3{
  color:var(--text);
  font-size:1.1rem;
  margin-top:20px;
}

.special-body ul{
  color:var(--muted);
  line-height:1.8;
}

.special-body p{
  color:var(--muted);
  line-height:1.5;
}

/* --- ESTILOS PARA TABLAS --- */
.special-body table{
  width:80%;
  border-collapse:collapse;
  margin:24px auto;
  background:rgba(0,0,0,0.05);
  border-radius:8px;
  overflow:hidden;
}

.special-body table th{
  background:rgba(var(--accent-rgb),0.1);
  color:var(--accent);
  font-weight:700;
  text-align:left;
  padding:16px 20px;
  font-size:1.05rem;
  border-bottom:2px solid var(--accent);
}

.special-body table td{
  padding:8px 20px;
  color:var(--muted);
  line-height:1.3;
  border-bottom:1px solid rgba(255,255,255,0.05);
}

.special-body table tr:last-child td{
  border-bottom:none;
}

.special-body table tr:hover{
  background:rgba(var(--accent-rgb),0.05);
}

/* --- FOOTER --- */
.footer{
  margin-top:100px;
  padding:40px 28px;
  border-top:1px solid var(--border);
  text-align:center;
}

.footer p{
  color:var(--muted);
  line-height:1.8;
  margin:0;
  font-size:.95rem;
}

.footer p a{
  color:var(--accent);
  text-decoration:none;
}

.footer p a:hover{
  opacity:.8;
}

@media(max-width:768px){
  .panel{width:95%}
}
</style>
</head>

<body>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-content">
      <span class="hero-badge">Universidad de Alicante · 2025-26</span>
      <h1>Taller avanzado<br>de IA</h1>
      <p><strong>Aprendizaje activo</strong> con inteligencia artificial</p>
      <div class="hero-meta">
        <span>Metodología</span>
        <span>·</span>
        <span>Pensamiento crítico</span>
        <span>·</span>
        <span>IA aplicada</span>
      </div>
    </div>
    <div class="hero-illustration" aria-hidden="true">
      <div class="brain"></div>
    </div>
  </div>
</section>

<main id="content"></main>

<section class="bottom-area">
  <div class="bottom-inner">
    <div id="bottom-content"></div>
    <footer class="footer">
      <p>Taller avanzado de inteligencia artificial</p>
      <p><a href="mailto:mario.florido@ua.es">mario.florido@ua.es</a></p>
      <p>Universidad de Alicante • 2025-26</p>
    </footer>
  </div>
</section>

<div id="overlay" class="overlay"></div>
<div id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title"></div>

<script src="app.js"></script>

</body>
</html>
